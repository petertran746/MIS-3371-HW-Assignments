<!DOCTYPE html>
<html lang="en">
<!--
Program name: patient-form.html
Author: Peter Tran
Date created: 02/20/2026
Date last edited: 04/20/2026
Version: 13.0
Description: This HTML document's particular purpose is to create a digital registration form. 
It instructs the computer where to show buttons, checkboxes, and text boxes on the screen, 
allowing a patient to choose symptoms, enter personal information, review their selections, and "Submit"
-->
<head>
    <meta charset="UTF-8">
    <title>Patient Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script> 
</head>
<body>
<img src="logo.png" alt="Company Logo">

    <h2>Patient Registration</h2>

    <form id="registrationForm" action="thankyou.html" method="GET">
        
        <fieldset>
            <legend>Personal Information</legend>
            <table class="form-layout">
                <tr>
                    <td><label for="fName">First Name:</label></td>
                    <td>
                        <input type="text" id="fName" pattern="[A-Za-z'\-]{1,30}" title="1 to 30 characters. Letters, apostrophes and dashes only" oninput="validateFirstName()" required>
                        <span id="fNameError" class="error-msg"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="mInit">Middle Initial:</label></td>
                    <td>
                        <input type="text" id="mInit" pattern="[A-Za-z]{1}" title="1 character, letters only" oninput="validateMiddleInitial()">
                        <span id="mInitError" class="error-msg"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="lName">Last Name:</label></td>
                    <td>
                        <input type="text" id="lName" pattern="[A-Za-z'\-2-5]{1,30}" title="1 to 30 characters. Letters, apostrophes, numbers 2-5, and dashes only" oninput="validateLastName()" required>
                        <span id="lNameError" class="error-msg"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td>
                        <input type="date" id="dob" title="Format: MM/DD/YYYY" oninput="validateDOB()" required>
                        <span id="dobError" class="error-msg"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="ssn">SSN / Patient ID:</label></td>
                    <td>
                        <input type="password" id="ssn" title="Must be exactly 9 digits" oninput="validateSSN()" required>
                        <span id="ssnError" class="error-msg"></span>
                    </td>
                </tr>
            </table>
        </fieldset>

        <fieldset>
            <legend>Contact & Address</legend>
            <table class="form-layout">
                <tr>
                    <td><label for="email">Email Address:</label></td>
                    <td>
                        <input type="email" id="email" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" title="Format: name@domain.tld" oninput="validateEmail()" required>
                        <span id="emailError" class="error-msg"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="phone">Phone Number:</label></td>
                    <td>
                        <input type="tel" id="phone" pattern="\d{3}-\d{3}-\d{4}" title="Format: 000-000-0000" oninput="validatePhone()" required>
                        <span id="phoneError" class="error-msg"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="address1">Address Line 1:</label></td>
                    <td>
                        <input type="text" id="address1" title="2 to 30 characters" oninput="validateAddress1()" required>
                        <span id="address1Error" class="error-msg"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="address2">Address Line 2:</label></td>
                    <td>
                        <input type="text" id="address2" title="Optional, 2 to 30 characters" oninput="validateAddress2()">
                        <span id="address2Error" class="error-msg"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="city">City:</label></td>
                    <td>
                        <input type="text" id="city" title="2 to 30 characters" oninput="validateCity()" required>
                        <span id="cityError" class="error-msg"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="state">State:</label></td>
                    <td>
                        <select id="state" title="Select your state from the list" onchange="validateState()" required>
                            <option value="">--Select a State--</option>
                            <option value="AL">Alabama</option>
                            <option value="AK">Alaska</option>
                            <option value="AZ">Arizona</option>
                            <option value="AR">Arkansas</option>
                            <option value="CA">California</option>
                            <option value="CO">Colorado</option>
                            <option value="CT">Connecticut</option>
                            <option value="DE">Delaware</option>
                            <option value="DC">District of Columbia</option>
                            <option value="FL">Florida</option>
                            <option value="GA">Georgia</option>
                            <option value="HI">Hawaii</option>
                            <option value="ID">Idaho</option>
                            <option value="IL">Illinois</option>
                            <option value="IN">Indiana</option>
                            <option value="IA">Iowa</option>
                            <option value="KS">Kansas</option>
                            <option value="KY">Kentucky</option>
                            <option value="LA">Louisiana</option>
                            <option value="ME">Maine</option>
                            <option value="MD">Maryland</option>
                            <option value="MA">Massachusetts</option>
                            <option value="MI">Michigan</option>
                            <option value="MN">Minnesota</option>
                            <option value="MS">Mississippi</option>
                            <option value="MO">Missouri</option>
                            <option value="MT">Montana</option>
                            <option value="NE">Nebraska</option>
                            <option value="NV">Nevada</option>
                            <option value="NH">New Hampshire</option>
                            <option value="NJ">New Jersey</option>
                            <option value="NM">New Mexico</option>
                            <option value="NY">New York</option>
                            <option value="NC">North Carolina</option>
                            <option value="ND">North Dakota</option>
                            <option value="OH">Ohio</option>
                            <option value="OK">Oklahoma</option>
                            <option value="OR">Oregon</option>
                            <option value="PA">Pennsylvania</option>
                            <option value="PR">Puerto Rico</option>
                            <option value="RI">Rhode Island</option>
                            <option value="SC">South Carolina</option>
                            <option value="SD">South Dakota</option>
                            <option value="TN">Tennessee</option>
                            <option value="TX">Texas</option>
                            <option value="UT">Utah</option>
                            <option value="VT">Vermont</option>
                            <option value="VA">Virginia</option>
                            <option value="WA">Washington</option>
                            <option value="WV">West Virginia</option>
                            <option value="WI">Wisconsin</option>
                            <option value="WY">Wyoming</option>
                        </select>
                        <span id="stateError" class="error-msg"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="zip">Zip Code:</label></td>
                    <td>
                        <input type="text" id="zip" pattern="[0-9]{5}" maxlength="5" title="Exactly 5 digits" oninput="validateZip()" required>
                        <span id="zipError" class="error-msg"></span>
                    </td>
                </tr>
            </table>
        </fieldset>

        <fieldset>
            <legend>Medical Details</legend>
            <table class="form-layout">
                <tr>
                    <td><label>Check all that apply:</label></td>
                    <td>
                        <input type="checkbox" id="chkPox" value="Chicken Pox"> Chicken Pox<br>
                        <input type="checkbox" id="chkMeasles" value="Measles"> Measles<br>
                        <input type="checkbox" id="chkMumps" value="Mumps"> Mumps<br>
                        <input type="checkbox" id="chkHeart" value="Heart Disease"> Heart Disease<br>
                        <input type="checkbox" id="chkCovid" value="Covid-19"> Covid-19
                    </td>
                </tr>
                <tr>
                    <td><label>Have you been vaccinated?</label></td>
                    <td>
                        <input type="radio" name="vaccinated" value="Yes" onchange="validateRadio()"> Yes<br>
                        <input type="radio" name="vaccinated" value="No" onchange="validateRadio()"> No<br>
                        <input type="radio" name="vaccinated" value="Unsure" onchange="validateRadio()"> Unsure<br>
                        <span id="radioError" class="error-msg"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="painSlider">Indicate Pain Level (1-10):</label></td>
                    <td>
                        <input type="range" id="painSlider" min="1" max="10" step="1" value="5" title="Slide left or right to select your pain level from 1 to 10" oninput="updateSliderValue()">
                        <strong id="painOutput">5</strong>
                    </td>
                </tr>
                <tr>
                    <td><label for="symptoms">Describe Symptoms:</label></td>
                    <td>
                        <textarea id="symptoms" rows="4" cols="50" title="Briefly describe your symptoms here" oninput="validateTextArea()"></textarea>
                        <span id="symptomsError" class="error-msg"></span>
                    </td>
                </tr>
            </table>
        </fieldset>

        <fieldset>
            <legend>Account Creation</legend>
            <table class="form-layout">
                <tr>
                    <td><label for="userId">Desired User ID:</label></td>
                    <td>
                        <input type="text" id="userId" pattern="^[a-zA-Z][a-zA-Z0-9_\-]{4,29}$" title="5-30 chars, starts with letter, no spaces" oninput="validateUserID()" required>
                        <span id="userIdError" class="error-msg"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="pwd1">Password:</label></td>
                    <td>
                        <input type="password" id="pwd1" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#%^&*()_\-+=\/><.,`~])[^&quot;]{8,30}$" title="8-30 chars, 1 upper, 1 lower, 1 number, 1 special. NO quotes." oninput="validatePasswords()" required>
                        <span id="pwd1Error" class="error-msg"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="pwd2">Re-enter Password:</label></td>
                    <td>
                        <input type="password" id="pwd2" title="Must exactly match the password entered above" oninput="validatePasswords()" required>
                        <span id="pwd2Error" class="error-msg"></span>
                    </td>
                </tr>
            </table>
        </fieldset>
        
        <button type="button" id="btnValidate" onclick="masterValidate()">Validate Form</button>
        <button type="submit" id="btnSubmit" style="display:none;">Final Submit</button>
        <button type="reset" onclick="location.reload()">Start Over</button>

    </form>

    <div id="reviewArea" style="display:none; margin-top: 30px; border-top: 2px solid #ccc; padding-top: 20px;">
        <h3>PLEASE REVIEW THIS INFORMATION</h3>
        <table id="reviewTable" border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
            </table>
    </div>

</body>
</html>
